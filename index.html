<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chef Recomp">
<meta name="theme-color" content="#0f1a0f">
<title>Chef Recomp 💪</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a120a;
    --surface: #111c11;
    --surface2: #162016;
    --border: #1e2e1e;
    --green: #4cff72;
    --green-dim: #2a8c3e;
    --orange: #ff8c42;
    --yellow: #ffd166;
    --text: #e8f5e8;
    --text-dim: #7a9c7a;
    --red: #ff5757;
    --radius: 16px;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:'DM Sans', sans-serif; }

  /* SPLASH */
  #splash {
    position:fixed; inset:0; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:999; transition: opacity 0.6s ease;
  }
  #splash h1 { font-family:'Bebas Neue'; font-size:72px; color:var(--green); letter-spacing:4px; line-height:1; }
  #splash p { color:var(--text-dim); font-size:14px; margin-top:8px; letter-spacing:2px; text-transform:uppercase; }
  #splash .bar { width:120px; height:3px; background:var(--border); border-radius:2px; margin-top:40px; overflow:hidden; }
  #splash .bar-fill { height:100%; width:0; background:var(--green); border-radius:2px; animation: load 1.5s ease forwards; }
  @keyframes load { to { width:100%; } }

  /* LAYOUT */
  #app { height:100vh; display:flex; flex-direction:column; opacity:0; transition: opacity 0.4s ease; }
  #app.visible { opacity:1; }

  /* HEADER */
  header {
    padding: 52px 20px 16px;
    background: linear-gradient(to bottom, var(--surface), transparent);
    display:flex; align-items:center; justify-content:space-between;
    flex-shrink:0;
  }
  header h1 { font-family:'Bebas Neue'; font-size:32px; color:var(--green); letter-spacing:2px; }
  .macros-badge {
    background:var(--surface2); border:1px solid var(--border);
    border-radius:50px; padding:6px 14px;
    font-size:12px; color:var(--text-dim);
    display:flex; gap:10px;
  }
  .macros-badge span { color:var(--green); font-weight:600; }

  /* NAV */
  nav {
    display:flex; gap:6px; padding:0 20px 12px;
    overflow-x:auto; scrollbar-width:none; flex-shrink:0;
  }
  nav::-webkit-scrollbar { display:none; }
  .nav-btn {
    flex-shrink:0; padding:8px 18px; border-radius:50px;
    border:1px solid var(--border); background:transparent;
    color:var(--text-dim); font-family:'DM Sans'; font-size:13px;
    cursor:pointer; transition:all 0.2s;
    display:flex; align-items:center; gap:6px;
  }
  .nav-btn.active { background:var(--green); color:#0a120a; border-color:var(--green); font-weight:600; }

  /* CONTENT */
  #content { flex:1; overflow-y:auto; padding:0 20px 100px; scrollbar-width:none; }
  #content::-webkit-scrollbar { display:none; }

  /* SECTION TITLE */
  .section-title {
    font-family:'Bebas Neue'; font-size:22px; letter-spacing:2px;
    color:var(--text-dim); margin:20px 0 12px;
    display:flex; align-items:center; gap:8px;
  }
  .section-title::after { content:''; flex:1; height:1px; background:var(--border); }

  /* RECIPE CARD */
  .recipe-card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); margin-bottom:12px;
    overflow:hidden; cursor:pointer;
    transition: transform 0.15s, border-color 0.15s;
    position:relative;
  }
  .recipe-card:active { transform:scale(0.98); }
  .recipe-card.open { border-color:var(--green-dim); }
  .card-header {
    padding:16px; display:flex; align-items:center; gap:12px;
  }
  .card-emoji { font-size:32px; flex-shrink:0; }
  .card-info { flex:1; }
  .card-title { font-weight:600; font-size:15px; margin-bottom:3px; }
  .card-meta { font-size:12px; color:var(--text-dim); display:flex; gap:10px; }
  .card-meta .tag {
    background:var(--surface2); border:1px solid var(--border);
    border-radius:50px; padding:2px 8px;
  }
  .card-meta .tag.green { border-color:var(--green-dim); color:var(--green); }
  .card-meta .tag.orange { border-color:#8c5a2a; color:var(--orange); }
  .card-arrow { color:var(--text-dim); font-size:18px; transition:transform 0.3s; }
  .recipe-card.open .card-arrow { transform:rotate(90deg); }

  /* RECIPE DETAIL */
  .recipe-detail { display:none; padding:0 16px 16px; border-top:1px solid var(--border); }
  .recipe-card.open .recipe-detail { display:block; }

  /* INGREDIENTS */
  .ingredients-grid {
    display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0;
  }
  .ingredient-item {
    background:var(--surface2); border-radius:10px; padding:10px;
    display:flex; flex-direction:column; gap:2px;
  }
  .ingredient-name { font-size:12px; color:var(--text-dim); }
  .ingredient-amount { font-size:15px; font-weight:600; color:var(--text); }

  /* STEPS */
  .steps-list { margin-top:16px; display:flex; flex-direction:column; gap:10px; }
  .step-item {
    display:flex; gap:12px; align-items:flex-start;
    padding:12px; background:var(--surface2); border-radius:12px;
    position:relative; overflow:hidden;
  }
  .step-item.done { opacity:0.5; }
  .step-item.done::after {
    content:'✓'; position:absolute; right:12px; top:50%;
    transform:translateY(-50%); color:var(--green); font-size:18px; font-weight:700;
  }
  .step-num {
    width:28px; height:28px; border-radius:50%; background:var(--green);
    color:#0a120a; font-weight:700; font-size:13px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .step-item.done .step-num { background:var(--green-dim); }
  .step-content { flex:1; }
  .step-title { font-weight:600; font-size:13px; margin-bottom:4px; color:var(--green); }
  .step-text { font-size:13px; color:var(--text-dim); line-height:1.5; }

  /* TIMER */
  .timer-btn {
    margin-top:8px; padding:6px 14px; border-radius:50px;
    background:transparent; border:1px solid var(--orange);
    color:var(--orange); font-size:12px; font-family:'DM Sans';
    cursor:pointer; display:flex; align-items:center; gap:6px;
    transition: background 0.2s;
  }
  .timer-btn:active { background:#8c5a2a33; }
  .timer-running { border-color:var(--green); color:var(--green); }

  /* TIMER OVERLAY */
  #timer-overlay {
    position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
    background:var(--surface); border:1px solid var(--green);
    border-radius:20px; padding:16px 24px;
    display:none; flex-direction:column; align-items:center; gap:8px;
    z-index:100; min-width:220px; box-shadow:0 8px 32px #00000080;
  }
  #timer-overlay.visible { display:flex; }
  #timer-name { font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; }
  #timer-display { font-family:'Bebas Neue'; font-size:52px; color:var(--green); letter-spacing:4px; line-height:1; }
  #timer-bar-wrap { width:100%; height:4px; background:var(--border); border-radius:2px; overflow:hidden; }
  #timer-bar { height:100%; background:var(--green); border-radius:2px; transition:width 1s linear; }
  #timer-close {
    padding:6px 20px; background:var(--border); border:none; border-radius:50px;
    color:var(--text-dim); font-family:'DM Sans'; font-size:13px; cursor:pointer;
  }

  /* MACROS PAGE */
  .macro-day {
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:16px; margin-bottom:12px;
  }
  .macro-day-title { font-family:'Bebas Neue'; font-size:20px; color:var(--green); letter-spacing:2px; margin-bottom:12px; }
  .macro-row { display:flex; justify-content:space-between; margin-bottom:8px; align-items:center; }
  .macro-label { font-size:13px; color:var(--text-dim); }
  .macro-val { font-size:14px; font-weight:600; }
  .macro-bar-wrap { width:100%; height:6px; background:var(--border); border-radius:3px; margin-top:4px; overflow:hidden; }
  .macro-bar { height:100%; border-radius:3px; }

  /* TIPS */
  .tip-card {
    background:var(--surface); border-left:3px solid var(--green);
    border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;
  }
  .tip-title { font-weight:600; font-size:14px; margin-bottom:4px; color:var(--green); }
  .tip-text { font-size:13px; color:var(--text-dim); line-height:1.6; }

  /* BOTTOM BAR */
  .bottom-safe { height:env(safe-area-inset-bottom, 0px); }
</style>
</head>
<body>

<div id="splash">
  <h1>CHEF<br>RECOMP</h1>
  <p>Muscle · Énergie · Résultats</p>
  <div class="bar"><div class="bar-fill"></div></div>
</div>

<div id="app">
  <header>
    <h1>Chef Recomp 💪</h1>
    <div class="macros-badge">~<span>185g</span> protéines/j</div>

    <button class="nav-btn" onclick="showPage('conseils')">💡 Conseils</button>
  </nav>

  <div id="content"></div>
</div>

<div id="timer-overlay">

  <div id="timer-bar-wrap"><div id="timer-bar" style="width:100%"></div></div>
  <button id="timer-close" onclick="stopTimer()">✕ Arrêter</button>
</div>

// ─── TIMER ──────────────────────────────────────────────────────────────────
let timerInterval = null;
let timerRemaining = 0;
let timerTotal = 0;

function startTimer(seconds, name) {
  if (timerInterval) clearInterval(timerInterval);
  timerRemaining = seconds;
  timerTotal = seconds;
  document.getElementById('timer-name').textContent = name;
  document.getElementById('timer-overlay').classList.add('visible');
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timerRemaining--;
    updateTimerDisplay();
    if (timerRemaining <= 0) {
      clearInterval(timerInterval);
      document.getElementById('timer-display').textContent = '✓ FINI !';
      document.getElementById('timer-display').style.color = 'var(--green)';
      if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
    }
  }, 1000);
}

function updateTimerDisplay() {
  const m = Math.floor(timerRemaining / 60);
  const s = timerRemaining % 60;
  document.getElementById('timer-display').textContent =
    String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  document.getElementById('timer-display').style.color = timerRemaining <= 10 ? 'var(--orange)' : 'var(--green)';
  document.getElementById('timer-bar').style.width = (timerRemaining / timerTotal * 100) + '%';
}

function stopTimer() {
  if (timerInterval) clearInterval(timerInterval);
  document.getElementById('timer-overlay').classList.remove('visible');
}

// ─── RENDER ─────────────────────────────────────────────────────────────────
function renderRecipeCard(recipe) {
  const stepsHtml = recipe.steps.map((step, i) => `
    <div class="step-item" id="step-${recipe.id}-${i}" onclick="toggleStep('${recipe.id}', ${i})">
      <div class="step-num">${i + 1}</div>
      <div class="step-content">
        <div class="step-title">${step.title}</div>
        <div class="step-text">${step.text}</div>
        ${step.timer ? `
          <button class="timer-btn" id="tbtn-${recipe.id}-${i}"
            onclick="event.stopPropagation(); launchTimer(${step.timer}, '${recipe.id}', ${i}, '${step.title}')">
            ⏱ ${Math.floor(step.timer/60) > 0 ? Math.floor(step.timer/60)+'min ' : ''}${step.timer%60 > 0 ? step.timer%60+'sec' : ''}
          </button>` : ''}
      </div>
    </div>`).join('');

  const ingredientsHtml = recipe.ingredients.map(ing => `
    <div class="ingredient-item">
      <div class="ingredient-name">${ing.name}</div>
      <div class="ingredient-amount">${ing.amount}</div>
    </div>`).join('');

  return `
    <div class="recipe-card" id="card-${recipe.id}" onclick="toggleCard('${recipe.id}')">
      <div class="card-header">
        <div class="card-emoji">${recipe.emoji}</div>
        <div class="card-info">
          <div class="card-title">${recipe.title}</div>
          <div class="card-meta">
            <span class="tag">⏱ ${recipe.time}</span>
            <span class="tag orange">🔥 ${recipe.kcal}</span>
            <span class="tag green">💪 ${recipe.proteines}</span>
          </div>
        </div>
        <div class="card-arrow">›</div>
      </div>
      <div class="recipe-detail">
        <div class="section-title" style="font-size:14px; margin:8px 0;">Ingrédients</div>
        <div class="ingredients-grid">${ingredientsHtml}</div>
        <div class="section-title" style="font-size:14px; margin:12px 0 8px;">Étapes</div>
        <div class="steps-list">${stepsHtml}</div>
      </div>
    </div>`;
}

function toggleCard(id) {
  const card = document.getElementById('card-' + id);
  card.classList.toggle('open');
}

function toggleStep(recipeId, stepIndex) {
  const step = document.getElementById(`step-${recipeId}-${stepIndex}`);
  step.classList.toggle('done');
}

function launchTimer(seconds, recipeId, stepIndex, title) {
  startTimer(seconds, title);
  const btn = document.getElementById(`tbtn-${recipeId}-${stepIndex}`);
  if (btn) btn.classList.add('timer-running');
}

function showPage(page) {
  // Update nav
  document.querySelectorAll('.nav-btn').forEach((btn, i) => btn.classList.remove('active'));
  const pages = ['matin','dejeuner','collation','diner','alternatives','conseils'];
  const idx = pages.indexOf(page);
  document.querySelectorAll('.nav-btn')[idx]?.classList.add('active');

  const content = document.getElementById('content');

  if (page === 'conseils') {
    content.innerHTML = `
      <div class="section-title">💡 Conseils Recomp</div>
      ${CONSEILS.map(c => `
        <div class="tip-card">
          <div class="tip-title">${c.title}</div>
          <div class="tip-text">${c.text}</div>
        </div>`).join('')}
      <div class="bottom-safe"></div>`;
    return;
  }

  const titles = {
    matin: '🌅 Petit Déjeuner',
    dejeuner: '☀️ Déjeuner',
    collation: '⚡ Collation',
    diner: '🌙 Dîner',
    alternatives: '🔄 Recettes Alternatives',
  };

  const recipes = RECIPES[page] || [];
  content.innerHTML = `
    <div class="section-title">${titles[page]}</div>
    ${recipes.map(renderRecipeCard).join('')}
    <div class="bottom-safe"></div>`;

  content.scrollTo({ top: 0, behavior: 'smooth' });
}
